# render.yaml — define el servicio web de integrappi en Render.
# Despliegue: `render blueprint` o crear el servicio desde este archivo en el dashboard.
#
# IMPORTANTE: Chromium requiere RAM. Usar al menos el plan "starter" (de pago);
# el free tier puede quedarse sin memoria o dormir entre requests (cold start lento).
services:
  - type: web
    name: integrappi
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    # El bot (login + descarga por planilla) puede tardar 1-2 min. El frontend ya
    # tolera esperas largas (modal de carga). Asegurar que el timeout del servicio
    # web de Render sea >= 120s (configurable en el dashboard o soporte).
    healthCheckPath: /
    envVars:
      # Configuración no sensible
      - key: SISCORE_BOT_HEADED
        value: "false"
      - key: SISCORE_BOT_TIMEOUT_MS
        value: "120000"
      - key: SISCORE_BOT_POPUP_TIMEOUT_MS
        value: "40000"
      - key: SISCORE_BOT_DOWNLOAD_DIR
        value: "/tmp/descargas_siscore"
      # Módulo de estudios de seguridad (todas no sensibles; ver rutas/seguridad_estudios.py)
      - key: SEGURIDAD_TOKEN_MINUTES
        value: "480"
      # Bucket PRIVADO (publicAccessPrevention enforced) — los PDF llevan datos
      # personales y SOLO se sirven por el endpoint autenticado. No usar el
      # bucket público integrapp aquí.
      - key: SEGURIDAD_ESTUDIOS_BUCKET
        value: "integrapp-privado"
      - key: SEGURIDAD_ESTUDIOS_CARPETA
        value: "SeguridadEstudios"
      # Base del QR de verificación de los PDF (URL pública del backend).
      - key: SEGURIDAD_ESTUDIOS_URL_PUBLICA
        value: "https://integrappi-dvmh.onrender.com"
      - key: SEGURIDAD_INTENTOS_FUENTE
        value: "2"
      - key: SEGURIDAD_BACKOFF_MS
        value: "3000"
      - key: SEGURIDAD_TIMEOUT_FUENTE_S
        value: "150"
      - key: SEGURIDAD_RETENCION_DIAS
        value: "730"
      - key: SEGURIDAD_MAX_VIAJES_PDF
        value: "300"
      - key: SEGURIDAD_MAX_VIAJES_DOC
        value: "500"
      - key: SEGURIDAD_CONSULTAS_MIN
        value: "10"
      # Cobro postpago de estudios (planes/cupos/cuentas de cobro)
      - key: SEGURIDAD_COBRO_CARPETA
        value: "SeguridadCobro"
      # true: exige plan+cupo para consultar; false: válvula para despliegue gradual
      - key: SEGURIDAD_COBRO_EXIGIR_PLAN
        value: "true"
      # Secretos: definir en el dashboard de Render (no se commitean)
      - key: MONGO_URI
        sync: false
      # JWT_SECRET compartido con baseusuarios — OBLIGATORIO fijar uno fuerte
      # (el default es inseguro y el módulo lo reporta como CRITICAL al arrancar).
      - key: JWT_SECRET
        sync: false
      - key: SISCORE_BOT_USER
        sync: false
      - key: SISCORE_BOT_PASS
        sync: false
      - key: VULCANO_PROXY_URL
        sync: false
        # Solo si Siscore exige salir por IP específica; si no, se puede omitir.
