# Alembic del Módulo Financiero — instancia DEDICADA y separada de la app.
# Solo conoce el schema `fin`; jamás toca public.informe_guias_tms ni nada
# existente (lo garantiza el include_object de fin_alembic/env.py).
#
# Uso:
#   alembic -c fin_alembic.ini upgrade head
#   alembic -c fin_alembic.ini revision -m "..."   (autogenerate solo schema fin)
[alembic]
script_location = fin_alembic
prepend_sys_path = .
# La URL la calcula env.py desde PG_* / FIN_DATABASE_URL (misma lógica que
# financiero/database.py); no se escribe aquí para no duplicar secretos.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
